// =============================================================================
// Unattended-upgrades — automatic security patches
// Placed at /etc/apt/apt.conf.d/50unattended-upgrades by setup.sh
// =============================================================================

Unattended-Upgrade::Allowed-Origins {
    "${distro_id}:${distro_codename}";
    "${distro_id}:${distro_codename}-security";
    "${distro_id}ESMApps:${distro_codename}-apps-security";
    "${distro_id}ESM:${distro_codename}-infra-security";
};

// Automatically reboot if a kernel update requires it (at 02:00 AM).
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "02:00";

// Remove unused packages after upgrade.
Unattended-Upgrade::Remove-Unused-Dependencies "true";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";

// Email notification on failure (configure MAIL_TO in /etc/apt/apt.conf.d/50unattended-upgrades).
// Unattended-Upgrade::Mail "root";
// Unattended-Upgrade::MailReport "on-change";
