---
# Shared deploy steps — imported by both provision.yml (initial) and deploy.yml.
# Runs as root (become: yes set in the parent play).

- name: Allow git to operate in vendor subdirectories owned by other users
  ansible.builtin.command:
    cmd: git config --global --add safe.directory '*'

- name: Install Composer dependencies
  ansible.builtin.command:
    cmd: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist
    chdir: "{{ app_dir }}"
  environment:
    COMPOSER_ALLOW_SUPERUSER: "1"
    COMPOSER_NO_INTERACTION: "1"
    COMPOSER_HOME: /root/.composer
  register: composer_result
  failed_when: composer_result.rc != 0

- name: Fail with Composer error details
  ansible.builtin.fail:
    msg: |
      Composer install failed in '{{ app_dir }}'.
      Common causes:
        - A package requires a PHP extension that is not installed
        - composer.lock is out of sync with composer.json (run 'composer update' locally and commit)
        - GitHub rate limit hit (add a GitHub OAuth token to composer config)
      Output: {{ composer_result.stdout | default('') }}
      Error:  {{ composer_result.stderr | default('') }}
  when: composer_result.rc is defined and composer_result.rc != 0

- name: Generate application key (required before asset build)
  ansible.builtin.shell: |
    grep -q '^APP_KEY=.\+' .env || php artisan key:generate --force
  args:
    chdir: "{{ app_dir }}"

- name: Clear config cache so artisan reads fresh .env
  ansible.builtin.command:
    cmd: php artisan optimize:clear
    chdir: "{{ app_dir }}"

- name: Ensure migrations tracking table exists
  ansible.builtin.shell: php artisan migrate:install --no-interaction 2>/dev/null || true
  args:
    chdir: "{{ app_dir }}"
  changed_when: false

- name: Run database migrations
  ansible.builtin.shell: |
    output=$(php artisan migrate --force 2>&1)
    rc=$?
    echo "$output"
    if [ $rc -ne 0 ] && echo "$output" | grep -q "already exists"; then
      php artisan migrate --fake --force
      exit 0
    fi
    exit $rc
  args:
    chdir: "{{ app_dir }}"
  register: migrate_result
  failed_when: migrate_result.rc != 0

- name: Fail with migration error details
  ansible.builtin.fail:
    msg: |
      Database migrations failed in '{{ app_dir }}'.
      Common causes:
        - The database server is unreachable (check DB_HOST in .env)
        - A migration has a SQL error (check the migration file)
        - The database user lacks ALTER/CREATE TABLE privileges
      Output: {{ migrate_result.stdout | default('') }}
      Error:  {{ migrate_result.stderr | default('') }}
      Check the full log: tail -100 {{ app_dir }}/storage/logs/laravel.log
  when: migrate_result.rc is defined and migrate_result.rc != 0

- name: Check for pnpm lockfile
  ansible.builtin.stat:
    path: "{{ app_dir }}/pnpm-lock.yaml"
  register: pnpm_lock

- name: Check for npm lockfile
  ansible.builtin.stat:
    path: "{{ app_dir }}/package-lock.json"
  register: npm_lock

- name: Grant execute permissions to pnpm binaries for build
  ansible.builtin.shell: |
    find {{ app_dir }}/node_modules/.bin -maxdepth 1 \
      | xargs -r readlink -f 2>/dev/null \
      | sort -u \
      | xargs -r chmod +x 2>/dev/null || true
  changed_when: false
  failed_when: false
  when: pnpm_lock.stat.exists

- name: Build assets with pnpm
  ansible.builtin.shell: |
    pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true
    pnpm run build
  args:
    chdir: "{{ app_dir }}"
  when: pnpm_lock.stat.exists
  register: pnpm_build_result
  failed_when: pnpm_build_result.rc != 0

- name: Fail with pnpm build error details
  ansible.builtin.fail:
    msg: |
      pnpm asset build failed in '{{ app_dir }}'.
      Common causes:
        - A Node.js package is missing or incompatible (try deleting node_modules and pnpm-lock.yaml locally, re-running pnpm install, and committing)
        - A build script error in vite.config.js or similar
        - Node.js version mismatch (check .nvmrc or engines field in package.json)
      Output: {{ pnpm_build_result.stdout | default('') }}
      Error:  {{ pnpm_build_result.stderr | default('') }}
  when: pnpm_lock.stat.exists and pnpm_build_result.rc is defined and pnpm_build_result.rc != 0

- name: Revert execute permissions on pnpm binaries after build
  ansible.builtin.shell: |
    find {{ app_dir }}/node_modules/.bin -maxdepth 1 \
      | xargs -r readlink -f 2>/dev/null \
      | sort -u \
      | xargs -r chmod 644 2>/dev/null || true
  changed_when: false
  failed_when: false
  when: pnpm_lock.stat.exists

- name: Build assets with npm
  ansible.builtin.shell: |
    npm ci --omit=dev
    npm run build
  args:
    chdir: "{{ app_dir }}"
  when: npm_lock.stat.exists and not pnpm_lock.stat.exists
  register: npm_build_result
  failed_when: npm_build_result.rc != 0

- name: Fail with npm build error details
  ansible.builtin.fail:
    msg: |
      npm asset build failed in '{{ app_dir }}'.
      Common causes:
        - package-lock.json is out of sync with package.json (run 'npm install' locally and commit)
        - A build script error in vite.config.js or similar
        - Node.js version mismatch (check .nvmrc or engines field in package.json)
      Output: {{ npm_build_result.stdout | default('') }}
      Error:  {{ npm_build_result.stderr | default('') }}
  when: npm_lock.stat.exists and not pnpm_lock.stat.exists and npm_build_result.rc is defined and npm_build_result.rc != 0

- name: Create storage symlink
  ansible.builtin.command:
    cmd: php artisan storage:link --force
    chdir: "{{ app_dir }}"
  failed_when: false

- name: Set file ownership and permissions
  block:
    - name: Set ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: www-data
        recurse: yes

    - name: Set directory permissions (755)
      ansible.builtin.shell: |
        find {{ app_dir }} \
          -not -path '{{ app_dir }}/.git/*' \
          -not -path '{{ app_dir }}/node_modules/*' \
          -type d -exec chmod 755 {} \;

    - name: Set file permissions (644)
      ansible.builtin.shell: |
        find {{ app_dir }} \
          -not -path '{{ app_dir }}/.git/*' \
          -not -path '{{ app_dir }}/node_modules/*' \
          -type f -exec chmod 644 {} \;

    - name: Set writable directories (775)
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0775'
        recurse: yes
      loop:
        - "{{ app_dir }}/storage"
        - "{{ app_dir }}/bootstrap/cache"

    - name: Protect .env (640)
      ansible.builtin.file:
        path: "{{ app_dir }}/.env"
        mode: '0640'

- name: Rebuild Laravel caches
  ansible.builtin.command:
    cmd: "php artisan {{ item }}"
    chdir: "{{ app_dir }}"
  loop:
    - config:cache
    - route:cache
    - view:cache
    - event:cache
  register: cache_result
  failed_when: cache_result.rc != 0

- name: Fail with cache rebuild error details
  ansible.builtin.fail:
    msg: |
      Laravel cache rebuild failed (php artisan {{ cache_result.item }}).
      Common causes:
        - A syntax error or missing class in a service provider or config file
        - A route file references a controller that does not exist
        - Run locally to reproduce: php artisan {{ cache_result.item }}
      Output: {{ cache_result.stdout | default('') }}
      Error:  {{ cache_result.stderr | default('') }}
  when: cache_result.rc is defined and cache_result.rc != 0

- name: Restart PHP-FPM (clears OPcache)
  ansible.builtin.service:
    name: "php{{ php_version }}-fpm"
    state: restarted

- name: Restart Supervisor workers
  ansible.builtin.command: "supervisorctl restart {{ app_name }}:*"
  register: supervisor_result
  failed_when: false

- name: Warn if Supervisor workers could not be restarted
  ansible.builtin.debug:
    msg: |
      WARNING: Could not restart Supervisor workers for '{{ app_name }}'.
      Queue jobs may still be running old code until workers are restarted.
      Fix manually: ssh <server> && supervisorctl restart {{ app_name }}:*
      Error: {{ supervisor_result.stderr | default('unknown') }}
  when: supervisor_result.rc != 0
