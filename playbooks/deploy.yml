---
# =============================================================================
# deploy.yml — Deploy the latest code to the server
#
# Usage:
#   make deploy
#   ansible-playbook playbooks/deploy.yml
# =============================================================================
- name: Deploy Laravel application
  hosts: all
  become: yes

  pre_tasks:
    - name: Validate SITE variables
      ansible.builtin.assert:
        that:
          - github_org is defined
          - github_repo is defined
          - repo_branch is defined
        fail_msg: "Usage: make deploy SITE=ORG/REPO:BRANCH"

    - name: Derive site variables from SITE argument
      ansible.builtin.set_fact:
        app_name: "{{ github_repo }}"
        app_user: "{{ github_repo }}"
        app_dir: "/var/www/{{ github_repo }}"
        repo_url: "git@github.com:{{ github_org }}/{{ github_repo }}.git"

    - name: Derive site path variables
      ansible.builtin.set_fact:
        deploy_log: "/var/www/{{ github_repo }}/storage/logs/deploy.log"
        ssh_key_dir: "/etc/{{ app_name }}/ssh"
        deploy_key_path: "/etc/{{ app_name }}/ssh/id_ed25519"

  tasks:
    - name: Sanity checks
      block:
        - name: Check app directory is a git repo
          ansible.builtin.stat:
            path: "{{ app_dir }}/.git"
          register: git_dir
        - name: Fail if not a git repo
          ansible.builtin.fail:
            msg: "{{ app_dir }} is not a git repository. Run provision first."
          when: not git_dir.stat.exists

    - name: Create pre-deploy backup
      ansible.builtin.command: "/usr/local/bin/{{ app_name }}-backup"
      failed_when: false

    - name: Put application in maintenance mode
      ansible.builtin.command:
        cmd: php artisan down --render=errors::503 --retry=60
        chdir: "{{ app_dir }}"
      failed_when: false

    - name: Mark app directory as safe for git
      ansible.builtin.command: git config --global --add safe.directory {{ app_dir }}
      changed_when: false

    - name: Fetch latest code from remote
      ansible.builtin.command:
        cmd: git fetch origin {{ repo_branch }}
        chdir: "{{ app_dir }}"
      environment:
        GIT_SSH_COMMAND: "ssh -i {{ deploy_key_path }} -o UserKnownHostsFile={{ ssh_key_dir }}/known_hosts"

    - name: Reset to latest remote commit (discard any local changes)
      ansible.builtin.command:
        cmd: git reset --hard FETCH_HEAD
        chdir: "{{ app_dir }}"

    - name: Remove untracked files and directories
      ansible.builtin.command:
        cmd: git clean -fd
        chdir: "{{ app_dir }}"

    - name: Run deploy steps
      block:
        - ansible.builtin.import_tasks: tasks/deploy-steps.yml
      rescue:
        - name: Lift maintenance mode on failure
          ansible.builtin.command:
            cmd: php artisan up
            chdir: "{{ app_dir }}"
          failed_when: false
        - name: Fail the playbook
          ansible.builtin.fail:
            msg: "Deployment failed. Application lifted from maintenance mode. Check logs at {{ deploy_log }}."

    - name: Lift maintenance mode
      ansible.builtin.command:
        cmd: php artisan up
        chdir: "{{ app_dir }}"

    - name: Health check — services active
      ansible.builtin.service_facts:
    - ansible.builtin.assert:
        that:
          - ansible_facts.services['php' ~ php_version ~ '-fpm.service'].state == 'running'
          - ansible_facts.services['nginx.service'].state == 'running'
        fail_msg: "A required service (PHP-FPM or Nginx) is not running after deploy!"

    - name: Health check — HTTP /up endpoint
      ansible.builtin.uri:
        url: "https://{{ domain }}/up"
        validate_certs: no
        status_code: 200
      retries: 6
      delay: 5
      register: health_result
      until: health_result.status == 200

    - name: Print deploy summary
      ansible.builtin.debug:
        msg: |
          Deployment complete!
            URL : https://{{ domain }}
            Log : {{ deploy_log }}
