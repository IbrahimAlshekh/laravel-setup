---
# =============================================================================
# backup.yml — Trigger a backup snapshot on the server
#
# Usage:
#   make backup
#   ansible-playbook playbooks/backup.yml
# =============================================================================
- name: Backup Laravel application
  hosts: all
  become: yes

  pre_tasks:
    - name: Validate SITE variables
      ansible.builtin.assert:
        that:
          - github_repo is defined
        fail_msg: "Usage: make backup SITE=ORG/REPO:BRANCH"

    - name: Derive app_name
      ansible.builtin.set_fact:
        app_name: "{{ github_repo }}"

  tasks:
    - name: Run backup script
      ansible.builtin.command: "/usr/local/bin/{{ app_name }}-backup"
      register: backup_output

    - name: Show backup output
      ansible.builtin.debug:
        msg: "{{ backup_output.stdout_lines }}"
