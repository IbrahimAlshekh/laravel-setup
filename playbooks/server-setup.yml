---
# =============================================================================
# server-setup.yml — One-time server provisioning (software only, no sites)
#
# Installs and hardens: nginx, PHP, MySQL, Valkey, Node.js, Composer,
# Supervisor, fail2ban, UFW, and SSH. Does not configure any application site.
#
# Usage:
#   make setup
# =============================================================================
- name: Set up server
  hosts: all
  become: yes

  pre_tasks:
    - name: Verify target is Ubuntu 22.04 or 24.04
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
          - ansible_facts['distribution_major_version'] | int >= 22
        fail_msg: "This playbook requires Ubuntu 22.04 or 24.04."

  roles:
    - role: common
      tags: common

    - role: php
      tags: php

    - role: composer
      tags: composer

    - role: nodejs
      tags: nodejs

    - role: mysql
      tags: mysql

    - role: valkey
      tags: valkey

    - role: nginx
      tags: nginx

    - role: certbot
      tags: certbot

    - role: supervisor
      tags: supervisor

    - role: fail2ban
      tags: fail2ban

    - role: ufw
      tags: ufw

    - role: ssh_hardening
      tags: ssh

  post_tasks:
    - name: Print server setup summary
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════════════════════════════
          Server setup complete!

          Next: add a site with
            1. Create sites/<repo>/vault.yml  (db_pass) and encrypt it
            2. make setup SITE=ORG/REPO:BRANCH DOMAIN=example.com EMAIL=you@example.com
          ══════════════════════════════════════════════════════════════
      tags: always
