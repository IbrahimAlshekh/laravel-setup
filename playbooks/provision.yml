---
# =============================================================================
# provision.yml — Convenience wrapper: server setup + site setup in one run
#
# Equivalent to:
#   make setup
#   make setup SITE=ORG/REPO:BRANCH
#
# Usage (via Makefile targets):
#   make setup                          # server only
#   make setup SITE=ORG/REPO:BRANCH    # site only
#
# Or run both at once with ansible-playbook directly:
#   ansible-playbook playbooks/provision.yml \
#     -e github_org=AtheerSolutions \
#     -e github_repo=castlegroup \
#     -e repo_branch=dev \
#     -e @sites/castlegroup/vars.yml \
#     -e @sites/castlegroup/vault.yml
# =============================================================================
- import_playbook: server-setup.yml
- import_playbook: site-setup.yml
