# =============================================================================
# SSH hardening drop-in
# Placed at /etc/ssh/sshd_config.d/99-hardening.conf
#
# IMPORTANT: Ensure you have a working SSH key pair set up for your user
# BEFORE applying this config, because PasswordAuthentication is disabled.
# =============================================================================

# Disable password login — key-only authentication.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# Disallow direct root login (root can still be reached via sudo from a key-only session).
PermitRootLogin prohibit-password

# Reduce brute-force surface.
MaxAuthTries 3
MaxSessions  5

# Client keepalive — disconnect idle sessions after 15 min.
ClientAliveInterval 300
ClientAliveCountMax 3

# Disable features not needed on a web server.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no

PrintMotd no

# Use only strong key exchange, ciphers, and MACs.
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512
Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,chacha20-poly1305@openssh.com
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128-etm@openssh.com
