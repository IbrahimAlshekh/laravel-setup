---
- name: Deploy fail2ban login filter for {{ app_name }}
  ansible.builtin.template:
    src: filter-app.conf.j2
    dest: "/etc/fail2ban/filter.d/{{ app_name }}-admin.conf"
    mode: '0644'
  notify: Reload fail2ban

- name: Deploy fail2ban jail config for {{ app_name }}
  ansible.builtin.template:
    src: jail-app.conf.j2
    dest: "/etc/fail2ban/jail.d/{{ app_name }}.conf"
    mode: '0644'
  notify: Reload fail2ban
