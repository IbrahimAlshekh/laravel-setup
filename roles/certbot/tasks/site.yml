---
- name: Check if TLS certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  register: tls_cert

- name: Check server public IP
  ansible.builtin.uri:
    url: https://api.ipify.org
    return_content: yes
  register: server_ip_result
  failed_when: false
  when: not tls_cert.stat.exists

- name: Resolve domain IP
  ansible.builtin.command: "host {{ domain }}"
  register: domain_resolve
  failed_when: false
  changed_when: false
  when: not tls_cert.stat.exists

- name: Assert DNS points to this server
  ansible.builtin.assert:
    that:
      - server_ip_result.content | trim in domain_resolve.stdout
    fail_msg: |
      DNS pre-check failed: {{ domain }} does not resolve to {{ server_ip_result.content | trim }}.
      Point the domain A record to this server and re-run the playbook.
    success_msg: "DNS check passed: {{ domain }} → {{ server_ip_result.content | trim }}"
  when: not tls_cert.stat.exists

- name: Obtain TLS certificate from Let's Encrypt
  ansible.builtin.command: >
    certbot certonly
    --webroot
    -w /var/www/html
    -d {{ domain }}
    -d www.{{ domain }}
    --email {{ certbot_email }}
    --agree-tos
    --non-interactive
  when: not tls_cert.stat.exists

- name: Generate DH params (2048-bit, runs once)
  ansible.builtin.command:
    cmd: openssl dhparam -out /etc/nginx/ssl-dhparams.pem 2048
    creates: /etc/nginx/ssl-dhparams.pem

- name: Deploy nginx HTTPS site config
  ansible.builtin.include_role:
    name: nginx
    tasks_from: https-site
