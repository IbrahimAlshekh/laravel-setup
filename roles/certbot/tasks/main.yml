---
- name: Install Certbot and Nginx plugin
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Check if TLS certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  register: tls_cert

- name: Check server public IP
  ansible.builtin.uri:
    url: https://api.ipify.org
    return_content: yes
  register: server_ip_result
  failed_when: false
  when: not tls_cert.stat.exists

- name: Resolve domain IP
  ansible.builtin.command: "host {{ domain }}"
  register: domain_resolve
  failed_when: false
  changed_when: false
  when: not tls_cert.stat.exists

- name: Assert DNS points to this server
  ansible.builtin.assert:
    that:
      - server_ip_result.content | trim in domain_resolve.stdout
    fail_msg: |
      DNS pre-check failed: {{ domain }} does not resolve to {{ server_ip_result.content | trim }}.
      Point the domain A record to this server and re-run the provision playbook.
    success_msg: "DNS check passed: {{ domain }} → {{ server_ip_result.content | trim }}"
  when: not tls_cert.stat.exists

- name: Obtain TLS certificate from Let's Encrypt
  ansible.builtin.command: >
    certbot certonly
    --webroot
    -w /var/www/html
    -d {{ domain }}
    -d www.{{ domain }}
    --email {{ certbot_email }}
    --agree-tos
    --non-interactive
  when: not tls_cert.stat.exists
  register: certbot_result

- name: Generate DH params (2048-bit, runs once)
  ansible.builtin.command:
    cmd: openssl dhparam -out /etc/nginx/ssl-dhparams.pem 2048
    creates: /etc/nginx/ssl-dhparams.pem

- name: Deploy HTTPS Nginx site config
  ansible.builtin.template:
    src: "{{ role_path }}/../nginx/templates/nginx.conf.j2"
    dest: "/etc/nginx/sites-available/{{ app_name }}"
    mode: '0644'
  notify: Reload nginx

- name: Enable HTTPS site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ app_name }}"
    dest: "/etc/nginx/sites-enabled/{{ app_name }}"
    state: link
  notify: Reload nginx

- name: Remove HTTP-only site (now replaced by HTTPS config)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/nginx/sites-enabled/{{ app_name }}-http"
    - "/etc/nginx/sites-available/{{ app_name }}-http"
  notify: Reload nginx

- name: Test Nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
