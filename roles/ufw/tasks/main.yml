---
- name: Set UFW default incoming policy to deny
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow SSH
  community.general.ufw:
    rule: allow
    name: OpenSSH
    comment: SSH

- name: Allow HTTP and HTTPS (Nginx Full)
  community.general.ufw:
    rule: allow
    name: "Nginx Full"
    comment: HTTP + HTTPS

- name: Enable UFW
  community.general.ufw:
    state: enabled
