---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Open ports 80 and 443 in UFW (needed for ACME challenge)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: "HTTP/HTTPS (pre-UFW-role)"
  loop:
    - "80"
    - "443"

- name: Create webroot for ACME challenge
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    mode: '0755'

- name: Deploy rate-limit zone config
  ansible.builtin.template:
    src: nginx-rate-limit.conf.j2
    dest: "/etc/nginx/conf.d/{{ app_name }}-rate-limit.conf"
    mode: '0644'
  notify: Reload nginx

- name: Deploy HTTP-only site (for ACME challenge before TLS)
  ansible.builtin.template:
    src: nginx-http-only.conf.j2
    dest: "/etc/nginx/sites-available/{{ app_name }}-http"
    mode: '0644'

- name: Enable HTTP-only site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ app_name }}-http"
    dest: "/etc/nginx/sites-enabled/{{ app_name }}-http"
    state: link

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: Test Nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Flush handlers (reload nginx before certbot)
  ansible.builtin.meta: flush_handlers
