---
- name: Install MySQL server
  ansible.builtin.apt:
    name: mysql-server
    state: present

- name: Enable and start MySQL
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: yes

- name: Check if root .my.cnf already exists
  ansible.builtin.stat:
    path: /root/.my.cnf
  register: root_mycnf

- name: Harden MySQL and set root password (first run via socket)
  ansible.builtin.shell: |
    mysql -u root <<'SQL'
    DELETE FROM mysql.user WHERE User='';
    DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost', '127.0.0.1', '::1');
    DROP DATABASE IF EXISTS test;
    DELETE FROM mysql.db WHERE Db='test' OR Db='test\_%';
    ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ db_root_pass }}';
    FLUSH PRIVILEGES;
    SQL
  no_log: true
  when: not root_mycnf.stat.exists

- name: Write root .my.cnf for subsequent runs
  ansible.builtin.copy:
    dest: /root/.my.cnf
    content: |
      [client]
      user=root
      password={{ db_root_pass }}
    mode: '0600'
  no_log: true
  when: not root_mycnf.stat.exists

- name: Create app database
  community.mysql.mysql_db:
    login_user: root
    login_password: "{{ db_root_pass }}"
    name: "{{ app_name }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    state: present
  no_log: true

- name: Create app MySQL user
  community.mysql.mysql_user:
    login_user: root
    login_password: "{{ db_root_pass }}"
    name: "{{ app_name }}"
    host: localhost
    password: "{{ db_pass }}"
    priv: "{{ app_name }}.*:ALL"
    state: present
  no_log: true

- name: Bind MySQL to localhost only
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address\s*='
    line: 'bind-address = 127.0.0.1'
    create: yes
  notify: Restart mysql

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
