---
# Ubuntu ships MySQL with root using the auth_socket plugin — authentication is
# handled by the OS (only the root OS user can connect). This is intentional.
# We connect via the Unix socket using login_unix_socket, which is the correct
# method for Ubuntu. No root password is needed or set.

- name: Install MySQL server and Python driver
  ansible.builtin.apt:
    name:
      - mysql-server
      - python3-pymysql
    state: present

- name: Enable and start MySQL
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: yes

- name: Harden MySQL (remove anonymous users, remote root, test db)
  ansible.builtin.shell: |
    mysql -u root <<'ENDSQL'
    DELETE FROM mysql.user WHERE User='';
    DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost', '127.0.0.1', '::1');
    DROP DATABASE IF EXISTS test;
    DELETE FROM mysql.db WHERE Db='test' OR Db='test\_%';
    FLUSH PRIVILEGES;
    ENDSQL
  changed_when: false

- name: Create app database
  community.mysql.mysql_db:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ app_name }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    state: present

- name: Create app MySQL user
  community.mysql.mysql_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ app_name }}"
    host: localhost
    password: "{{ db_pass }}"
    priv: "{{ app_name }}.*:ALL"
    state: present
  no_log: true

- name: Bind MySQL to localhost only
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address\s*='
    line: 'bind-address = 127.0.0.1'
    create: yes
  notify: Restart mysql

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
