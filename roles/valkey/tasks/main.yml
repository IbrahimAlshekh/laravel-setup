---
# Redis is the package available on Ubuntu 22.04. Valkey (its fork) requires
# libc6 >= 2.38 which 22.04 doesn't ship. Redis is protocol-identical to
# Valkey — the same PHP extension, Laravel config, and commands work unchanged.
- name: Install Redis
  ansible.builtin.apt:
    name:
      - redis-server
      - redis-tools
    state: present
    update_cache: yes

- name: Deploy Redis app config
  ansible.builtin.template:
    src: valkey-app.conf.j2
    dest: /etc/redis/redis-app.conf
    owner: redis
    group: redis
    mode: '0640'
  no_log: true
  notify: Restart valkey

- name: Include app config in main redis.conf
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    line: 'include /etc/redis/redis-app.conf'
    insertafter: EOF
    create: no
  notify: Restart valkey

- name: Enable and start Redis
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: yes
