---
# =============================================================================
# Server-level defaults — apply to all sites on this server.
#
# Site-specific configuration (domain, certbot_email, deploy_on_push) lives in:
#   sites/<repo>/vars.yml     (non-secret)
#   sites/<repo>/vault.yml    (secrets — encrypt with ansible-vault)
#
# Site variables (app_name, app_dir, repo_url, etc.) are derived automatically
# from the SITE=ORG/REPO:BRANCH argument passed to make commands.
# =============================================================================

# ── Runtime versions ──────────────────────────────────────────────────────────
php_version: "8.4"
node_version: "22"

# ── Backups ───────────────────────────────────────────────────────────────────
keep_backups: 7

# ── Valkey (shared Redis-compatible cache/queue) ──────────────────────────────
# redis_pass comes from inventory/group_vars/all/vault.yml (server-level secret)
redis_pass: "{{ vault_redis_pass }}"
